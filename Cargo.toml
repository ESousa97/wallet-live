[package]
name = "wallet"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = { version = "0.16.0", features = ["derive"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.10.1", features = ["cookie"] }
base64 = "0.22.1"
color-eyre = "0.6.5"
jwt-simple = { version = "0.12.12", default-features = false, features = ["pure-rust"] }
password-auth = "1.0.0"
dotenvy = "0.15.7"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "native-tls"] }
rust_decimal = { version = "1.36", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.8"
sqlx = { version = "0.9.0", features = ["macros", "postgres", "runtime-tokio", "migrate", "time", "rust_decimal"] }
subtle = "2.6.1"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["serde", "parsing", "formatting"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["decimal"] }

[dev-dependencies]
insta = { version = "1.47.2", features = ["json"] }
rust_decimal_macros = "1.36"
