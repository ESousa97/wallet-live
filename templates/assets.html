{% extends "base.html" %}

{% block title %}wallet :: carteira{% endblock %}

{% block content %}
<main class="mx-auto max-w-6xl px-6 py-8">
    <a href="#conteudo" class="sr-only focus:not-sr-only focus:absolute focus:left-6 focus:top-4 focus:z-10 focus:rounded-lg focus:bg-neutral-100 focus:px-4 focus:py-2.5 focus:text-sm focus:font-semibold focus:text-neutral-900">pular para o conteúdo</a>
    <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-semibold tracking-tight">wallet</h1>
            <p class="mt-1 text-sm text-neutral-400">bem-vindo, {{ user.username() }}</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <a href="/deposit" hx-get="/deposit" hx-target="#wallet" hx-swap="outerHTML" hx-push-url="true" class="rounded-lg bg-neutral-100 px-4 py-2.5 text-sm font-semibold text-neutral-900 transition hover:bg-white">depositar</a>
            <a href="/buy" hx-get="/buy" hx-target="#wallet" hx-swap="outerHTML" hx-push-url="true" class="rounded-lg border border-neutral-700 px-4 py-2.5 text-sm font-medium text-neutral-300 transition hover:border-neutral-500 hover:text-white">comprar</a>
            <a href="/sell" hx-get="/sell" hx-target="#wallet" hx-swap="outerHTML" hx-push-url="true" class="rounded-lg border border-neutral-700 px-4 py-2.5 text-sm font-medium text-neutral-300 transition hover:border-neutral-500 hover:text-white">vender</a>
            <form method="post" action="/quotes/sync" hx-post="/quotes/sync" hx-target="#wallet" hx-swap="outerHTML">
                <input type="hidden" name="csrf_token" value="{{ wallet.csrf_token }}" />
                <button class="rounded-lg border border-neutral-700 px-4 py-2.5 text-sm font-medium text-neutral-300 transition hover:border-neutral-500 hover:text-white">atualizar cotações</button>
            </form>
            <a href="/logout" class="rounded-lg border border-neutral-800 px-4 py-2.5 text-sm font-medium text-neutral-500 transition hover:text-neutral-200">sair</a>
        </div>
    </header>

    {% include "wallet.html" %}
</main>
{% endblock %}
